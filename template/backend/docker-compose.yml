services:
  # Optional complete API+DB environment. Run migrations first (see README).
  api:
    profiles: [full]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgres://app:local_dev_password@db:5432/standard_api
      ENABLE_DOCS: "false"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: standard_api
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d standard_api"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
